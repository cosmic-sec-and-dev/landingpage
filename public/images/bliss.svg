<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1460cd" />
      <stop offset="35%" stop-color="#2a7be4" />
      <stop offset="65%" stop-color="#60a8f8" />
      <stop offset="85%" stop-color="#93c8fd" />
      <stop offset="100%" stop-color="#cbe5fe" />
    </linearGradient>

    <!-- Sun Glow -->
    <radialGradient id="sunGlow" cx="20%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#fdfbf0" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Back Hill Gradient -->
    <linearGradient id="backHill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#97d84a" />
      <stop offset="45%" stop-color="#73c032" />
      <stop offset="100%" stop-color="#3c8e1e" />
    </linearGradient>

    <!-- Main Rolling Hill Gradient (Sonoma green) -->
    <linearGradient id="mainHill" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#9fe643" />
      <stop offset="25%" stop-color="#7ecf2b" />
      <stop offset="55%" stop-color="#4ea819" />
      <stop offset="85%" stop-color="#2e7c10" />
      <stop offset="100%" stop-color="#1b520a" />
    </linearGradient>

    <!-- Right Hill Gradient -->
    <linearGradient id="rightHill" x1="30%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fd435" />
      <stop offset="50%" stop-color="#5cae1c" />
      <stop offset="100%" stop-color="#24680c" />
    </linearGradient>

    <!-- Foreground Slope Gradient -->
    <linearGradient id="foreHill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#75c822" />
      <stop offset="60%" stop-color="#3d8a12" />
      <stop offset="100%" stop-color="#194c07" />
    </linearGradient>

    <!-- Cloud Filter for Soft Edges -->
    <filter id="cloudSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <filter id="cloudHazy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <!-- SKY -->
  <rect width="1920" height="1080" fill="url(#skyGrad)" />
  <rect width="1920" height="1080" fill="url(#sunGlow)" />

  <!-- CLOUDS (Authentic Bliss Fluffy Cirrus/Cumulus Layers) -->
  <g opacity="0.82" filter="url(#cloudHazy)">
    <ellipse cx="480" cy="220" rx="380" ry="85" fill="#ffffff" />
    <ellipse cx="640" cy="210" rx="320" ry="70" fill="#ffffff" />
    <ellipse cx="1200" cy="180" rx="450" ry="90" fill="#ffffff" />
    <ellipse cx="1450" cy="230" rx="360" ry="75" fill="#ffffff" />
    <ellipse cx="260" cy="310" rx="280" ry="65" fill="#ffffff" />
  </g>

  <g opacity="0.95" filter="url(#cloudSoft)">
    <!-- Main Left Cloud Formation -->
    <ellipse cx="460" cy="240" rx="240" ry="55" fill="#ffffff" />
    <ellipse cx="380" cy="230" rx="160" ry="50" fill="#ffffff" />
    <ellipse cx="560" cy="225" rx="190" ry="52" fill="#ffffff" />
    <ellipse cx="490" cy="205" rx="140" ry="46" fill="#ffffff" />

    <!-- Center Upper Wisps -->
    <ellipse cx="920" cy="160" rx="210" ry="38" fill="#ffffff" opacity="0.75" />
    <ellipse cx="1030" cy="150" rx="180" ry="35" fill="#ffffff" opacity="0.7" />

    <!-- Right Dramatic Cloud Cluster -->
    <ellipse cx="1380" cy="220" rx="260" ry="60" fill="#ffffff" />
    <ellipse cx="1520" cy="210" rx="220" ry="58" fill="#ffffff" />
    <ellipse cx="1280" cy="235" rx="180" ry="50" fill="#ffffff" />
    <ellipse cx="1430" cy="190" rx="150" ry="48" fill="#ffffff" />
    <ellipse cx="1620" cy="240" rx="180" ry="46" fill="#ffffff" />

    <!-- Distant Horizon Cloud Haze -->
    <ellipse cx="180" cy="480" rx="320" ry="55" fill="#ffffff" opacity="0.6" />
    <ellipse cx="800" cy="510" rx="420" ry="50" fill="#ffffff" opacity="0.55" />
    <ellipse cx="1700" cy="460" rx="350" ry="60" fill="#ffffff" opacity="0.65" />
  </g>

  <!-- DISTANT BACKGROUND HILL -->
  <path d="M -100 660 Q 450 510 980 580 T 2050 560 L 2050 1100 L -100 1100 Z" fill="url(#backHill)" opacity="0.9" />

  <!-- RIGHT DISTANT CREST -->
  <path d="M 680 620 Q 1200 480 1780 520 Q 1880 528 2050 540 L 2050 1100 L 680 1100 Z" fill="url(#rightHill)" />

  <!-- FAMOUS SONOMA MAIN ROLLING HILL (Center-Left to Bottom-Right sweeping crest) -->
  <path d="M -100 580 Q 280 430 740 540 Q 1150 630 1520 730 Q 1820 810 2050 840 L 2050 1100 L -100 1100 Z" fill="url(#mainHill)" />

  <!-- FOREGROUND LUSH SWEEP -->
  <path d="M -100 780 Q 320 670 780 730 Q 1260 790 1740 920 Q 1920 960 2050 990 L 2050 1100 L -100 1100 Z" fill="url(#foreHill)" />

  <!-- SUNLIGHT HIGHLIGHT SHEEN (Golden Green glow on crest) -->
  <path d="M 120 480 Q 380 435 680 490 Q 560 520 280 535 Z" fill="#bbf255" opacity="0.45" filter="url(#cloudSoft)" />
</svg>
